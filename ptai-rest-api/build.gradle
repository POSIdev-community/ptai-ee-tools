plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'org.hidetake.swagger.generator' version '2.19.2'
}

group = "${rootGroup}"

dependencies {
    // swaggerCodegen 'org.openapitools:openapi-generator-cli:4.3.1'
    swaggerCodegen 'org.openapitools:openapi-generator-cli:5.1.1'
    // swaggerCodegen 'org.openapitools:openapi-generator-cli:6.2.0'

    // https://mvnrepository.com/artifact/com.squareup.okhttp3/okhttp
    api 'com.squareup.okhttp3:okhttp:5.2.1'
    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    api 'com.google.code.gson:gson:2.13.2'

    // https://mvnrepository.com/artifact/org.openapitools/jackson-databind-nullable
    // implementation 'org.openapitools:jackson-databind-nullable:0.2.3'

    // Need this as generated code uses annotations like @Nullable etc.
    // https://mvnrepository.com/artifact/com.google.code.findbugs/jsr305
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    // Used inside generated code
    // https://mvnrepository.com/artifact/com.squareup.okhttp3/logging-interceptor
    implementation 'com.squareup.okhttp3:logging-interceptor:4.2.2'

    // Used inside generated code
    // https://mvnrepository.com/artifact/io.swagger/swagger-annotations
    implementation 'io.swagger:swagger-annotations:1.6.2'
    // Used inside generated code
    // https://mvnrepository.com/artifact/io.gsonfire/gson-fire
    implementation 'io.gsonfire:gson-fire:1.8.5'
    // Need this as generated code uses annotations like @Nullable etc.
    // https://mvnrepository.com/artifact/javax.annotation/javax.annotation-api
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // Use JUnit 5 for test fixtures
    testFixturesImplementation(platform("org.junit:junit-bom:$junitVersion"))
    testFixturesImplementation('org.junit.jupiter:junit-jupiter')

    // Need this to write tests that use some common functions like
    // logging, zipped data processing, JSON parse etc.
    testImplementation(testFixtures(project(":pt-misc-tools")))
    testImplementation(testFixtures(project(":ptai-data-structures")))

    testFixturesImplementation(testFixtures(project(":pt-misc-tools")))
    testFixturesImplementation(testFixtures(project(":ptai-data-structures")))
}

javadoc {
    // OpenAPI-generated files contain some javadoc issues, let's ignore them
    // options.addStringOption('Xdoclint:none', '-quiet')
}

jar {
    // See https://www.jenkins.io/blog/2018/01/13/jep-200/
    manifest {
        attributes 'Jenkins-ClassFilter-Whitelisted': 'true'
    }
}

swaggerSources {
    auth530 {
        inputFile = file('src/main/resources/api/v530/auth.yaml')
        code {
            language = 'java'
            library = 'okhttp-gson'
            additionalProperties = [
                    'modelPackage': 'com.ptsecurity.appsec.ai.ee.server.v530.auth.model',
                    'apiPackage': 'com.ptsecurity.appsec.ai.ee.server.v530.auth.api',
                    'dateLibrary': 'java8',
                    'hideGenerationTimestamp': 'true'
            ]
        }
    }

    api530 {
        inputFile = file('src/main/resources/api/v530/swagger.yaml')
        code {
            language = 'java'
            library = 'okhttp-gson'
            additionalProperties = [
                    'modelPackage': 'com.ptsecurity.appsec.ai.ee.server.v530.api.model',
                    'apiPackage': 'com.ptsecurity.appsec.ai.ee.server.v530.api.api',
                    'dateLibrary': 'java8',
                    'hideGenerationTimestamp': 'true'
            ]
        }
    }

    notifications530 {
        inputFile = file('src/main/resources/api/v530/notifications.yml')
        code {
            language = 'java'
            library = 'okhttp-gson'
            additionalProperties = [
                    'modelPackage': 'com.ptsecurity.appsec.ai.ee.server.v530.notifications.model',
                    'apiPackage': 'com.ptsecurity.appsec.ai.ee.server.v530.notifications.api',
                    'dateLibrary': 'java8',
                    'hideGenerationTimestamp': 'true'
            ]
        }
    }
}

compileJava.dependsOn \
 swaggerSources.auth530.code, \
 swaggerSources.api530.code, \
 swaggerSources.notifications530.code

sourceSets.main.java.srcDirs \
 "${swaggerSources.auth530.code.outputDir}/src/main/java", \
 "${swaggerSources.api530.code.outputDir}/src/main/java", \
 "${swaggerSources.notifications530.code.outputDir}/src/main/java"
